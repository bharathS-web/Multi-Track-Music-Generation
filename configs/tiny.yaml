# CPU smoke-test config: tiny model, few epochs.
data:
  dir: data/processed
  num_workers: 0
model:
  mode: hybrid
  d_model: 32
  n_layers: 2
  n_heads: 2
  d_state: 4
  d_conv: 4
  expand: 2
  ffn_mult: 2
  dropout: 0.0
  grad_checkpoint: false
  use_official_mamba: false
  tie_embeddings: true
  interaction_graph: true  # paper Eq. 11 (false = simpler track-pair bias)
train:
  epochs: 2
  batch_size: 4
  lr: 1.0e-3
  weight_decay: 0.0
  warmup_steps: 5
  grad_clip: 1.0
  amp: false
  seed: 42
  save_every: 0            # 0 = only at the end of each epoch
  log_every: 5
  run_dir: runs
