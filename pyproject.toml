[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtmg"
version = "0.2.0"
description = "Hybrid multi-track music generation with per-track Mamba and cross-track attention"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy", "pretty_midi", "pyyaml", "tqdm"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
